<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数独</title>
  <script src="./theme-init.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <header class="hero">
      <h1 id="title">数独</h1>
      <div class="utility-actions">
        <div class="utility-buttons">
          <button class="ghost" id="saveGame" type="button">存档</button>
          <button class="ghost" id="loadGame" type="button">读档</button>
          <button class="ghost" id="help" type="button" aria-haspopup="dialog" aria-controls="helpOverlay" aria-expanded="false">游戏说明</button>
        </div>
        <div class="timer-group">
          <button class="ghost" id="timerPause" type="button">⏸ 暂停计时</button>
          <div class="timer" id="timer" aria-live="polite">--:--</div>
        </div>
        <input id="loadFile" type="file" accept=".json,application/json" hidden />
      </div>
    </header>

    <div class="top-bar">
      <div class="settings-grid">
        <div class="field">
          <label id="clueCountLabel" for="clueCount">提示线索数</label>
          <select id="clueCount">
            <option value="17">17条线索（极难）</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="24">24条线索（非常困难）</option>
            <option value="26">26</option>
            <option value="28">28条线索（困难）</option>
            <option value="30">30</option>
            <option value="32" selected>32条线索（普通难度）</option>
            <option value="34">34</option>
            <option value="36">36</option>
            <option value="38">38条线索（简单）</option>
            <option value="40">40</option>
            <option value="42">42</option>
            <option value="44">44条线索（非常简单）</option>
            <option value="46">46</option>
            <option value="48">48</option>
          </select>
        </div>

        <div class="field" id="seedField">
          <label id="seedLabel" for="seed">种子值（留空随机生成）</label>
          <input id="seed" type="number" placeholder="选填（留空则随机生成谜题）" />
        </div>

        <div class="field">
          <label id="langLabel" for="lang">语言</label>
          <select id="lang">
            <option value="cn">简体中文</option>
            <option value="ja">Japanese</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="field">
          <label id="themeLabel" for="theme">主题</label>
          <select id="theme">
            <option value="system">跟随系统</option>
            <option value="light">浅色模式</option>
            <option value="dark">深色模式</option>
          </select>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="preference-save-toggle" id="selectedCellHighlightToggle" title="开启后，选中格子时，该格子所在的行、列、3×3 宫都会高亮，棋盘上其他该数字只高亮其所在格子。两个开关同时开启时，只高亮棋盘上选中数字所在的格子。">
              <input id="selectedCellHighlight" type="checkbox" />
              <span id="selectedCellHighlightLabel">选中格子行列宫高亮</span>
            </label>
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="preference-save-toggle" id="sameNumberHighlightToggle" title="开启后，选中某个有数字的格子时，棋盘上所有包含该数字的行、列、3×3 宫以及选中格子所在的行、列、3×3 宫都会高亮；关闭后仅高亮选中数字所在的格子。两个开关同时开启时，只高亮棋盘上选中数字所在的格子。">
              <input id="sameNumberHighlight" type="checkbox" />
              <span id="sameNumberHighlightLabel">相同数字行列宫高亮</span>
            </label>
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="preference-save-toggle" id="preferenceSaveToggle" title="在当前浏览器中保存线索数、种子值、语言和主题偏好">
              <input id="persistPreferences" type="checkbox" />
              <span id="preferenceSaveLabel">保存设置</span>
            </label>
          </div>
        </div>
      </div>
      </div>

      <div class="action-row primary-actions">
        <button class="primary" id="newGame" type="button">新谜题</button>
        <button class="ghost" id="reset" type="button">重置开局</button>
        <button class="ghost" id="hint" type="button">获取提示</button>
        <button class="ghost" id="solve" type="button">显示完整答案</button>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="board-zone">
        <div class="board" id="board" aria-label="数独棋盘"></div>
        <div class="board-paused-overlay" id="boardPausedOverlay" hidden>⏸ 计时已暂停，点击恢复</div>
      </div>
      <div class="panel">
        <h2 id="padTitle">数字键盘</h2>
        <div class="pad" id="pad"></div>
        <div class="controls">
          <button class="ghost" id="undo">↩️ 撤销</button>
          <button class="ghost" id="redo">↪️ 重做</button>
        </div>
        <p class="hint-text" id="hintText"></p>
        <div class="stats" id="stats"></div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="help-overlay" id="helpOverlay" hidden>
      <section class="help-dialog" id="helpDialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <div class="help-header">
          <h2 id="helpTitle">游戏说明</h2>
          <button class="ghost" id="helpClose" type="button">关闭</button>
        </div>
        <div class="help-content" id="helpContent"></div>
      </section>
    </div>

    <div class="help-overlay" id="solvedOverlay" hidden>
      <section class="help-dialog solved-dialog" id="solvedDialog" role="dialog" aria-modal="true" aria-labelledby="solvedTitle">
        <h2 id="solvedTitle">🎉 恭喜，谜题已解开！</h2>
        <p class="solved-time" id="solvedTime">用时：--:--</p>
        <p class="solved-record" id="solvedRecord" hidden></p>
        <button class="primary" id="solvedNewGame" type="button">确定并开始新谜题</button>
      </section>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
  <script type="module" src="./theme.js"></script>
</body>
</html>
